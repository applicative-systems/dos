site_name: Deutschland-OS
# GitHub Pages (the organization's custom domain); needed for the sitemap and
# canonical links
site_url: https://applicative.systems/dos/
site_description: NixOS modules implementing our interpretation of BSI Grundschutz++
repo_url: https://github.com/applicative-systems/dos
repo_name: applicative-systems/dos
edit_uri: edit/main/documentation/docs
copyright: Code MIT; BSI requirement texts CC BY-SA 4.0 (Bundesamt für Sicherheit in der Informationstechnik)

hooks:
  - hooks.py

plugins:
  # navigation order from .pages files (the requirement pages are generated)
  - awesome-pages
  - search

theme:
  name: material
  # symlink to assets/dos-logo-gradient.svg (copied in by the Nix build)
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # no Google Fonts: the build runs in the Nix sandbox
  font: false
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    # only the current section in the sidebar: 100+ requirement pages
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      primary: white
      accent: grey
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      primary: white
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: grey
      accent: blue
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
