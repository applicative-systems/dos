name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Container tests (e.g. konf-7-15) need these host settings:
      # https://applicative.systems/nixos-test-driver-manual/features/container/#host-configuration
      # Not enabled: devnet, which only tests with both VMs and containers use.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            auto-allocate-uids = true
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            extra-system-features = uid-range

      - name: nix flake check
        run: nix flake check -L
