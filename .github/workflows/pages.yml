# Builds the website (`nix build .#documentation`) and publishes it on
# GitHub Pages. Needs Settings > Pages > Source: "GitHub Actions".

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deployment at a time; do not cancel a running one
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build documentation
        run: |
          nix build .#documentation -L
          # dereference the store symlink; the artifact action wants a directory
          cp -rL result site
          chmod -R u+w site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
